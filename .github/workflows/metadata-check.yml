name: metadata-check

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      files:
        description: "要检查的稿件路径；多个路径用英文逗号分隔"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  metadata:
    name: 检查元数据
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test journal rules
        run: npm test

      - name: Check metadata
        run: npm run check:metadata
        env:
          CHECK_METADATA_FILES: ${{ inputs.files || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
